name: release-stable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.1; default from VERSION file)"
        default: ""

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d ' \r\n' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Target version: $V"

  linux:
    needs: [prep]
    runs-on: ubuntu-22.04
    env:
      WAYLAND_PROTOCOLS: "1.45"
      WAYLAND_PROTOCOLS_SHA256: 4d2b2a9e3e099d017dc8107bf1c334d27bb87d9e4aff19a0c8d856d17cd41ef0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config glslang-tools git \
            libvulkan-dev libfreetype-dev libfontconfig-dev libx11-dev libxcursor-dev libxrandr-dev libwayland-dev \
            libxkbcommon-dev libdbus-1-dev mesa-vulkan-drivers

      - name: wayland-protocols ${{ env.WAYLAND_PROTOCOLS }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o wp.tar.xz "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/$WAYLAND_PROTOCOLS/downloads/wayland-protocols-$WAYLAND_PROTOCOLS.tar.xz"
          echo "$WAYLAND_PROTOCOLS_SHA256  wp.tar.xz" | sha256sum -c -
          tar xf wp.tar.xz
          echo "VCS_WAYLAND_PROTOCOLS_DIR=$RUNNER_TEMP/wayland-protocols-$WAYLAND_PROTOCOLS" >> "$GITHUB_ENV"

      - name: Build the launcher
        run: python3 tools/build.py --launcher

      - name: Release AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python3 tools/release.py --platform linux --version ${{ needs.prep.outputs.version }} --launcher VCSLauncher --worktree

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            build/dist/*.AppImage
            build/dist/*.AppImage.sha256

  windows:
    needs: [prep]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          path: build/build-tools
          key: build-tools-windows-${{ hashFiles('tools/toolchain.py') }}

      - name: Build the launcher
        run: python tools/build.py --launcher

      - name: Release zip
        run: python tools/release.py --version ${{ needs.prep.outputs.version }} --launcher VCSLauncher.exe --worktree

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            build/dist/*.zip
            build/dist/*.zip.sha256

  publish:
    needs: [prep, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish Stable Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.prep.outputs.version }}
        run: |
          ls -la dist
          TAG="v${VER}"
          TITLE="Leonidas ViceCityStories v${VER}"
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            notes_arg=(--notes-file "$notes")
          else
            notes_arg=(--generate-notes)
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
            gh release edit "$TAG" --repo "${{ github.repository }}" --target "${GITHUB_SHA}" --title "$TITLE" "${notes_arg[@]}"
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" dist/* --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" --title "$TITLE" "${notes_arg[@]}" --latest
          fi
